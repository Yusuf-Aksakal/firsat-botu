name: Firsat Botu Calistirici

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı kendi kendine çalışır
  workflow_dispatch: # Elle test etmek için buton ekler

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yukle
        run: pip install requests

      - name: Botu Calistir
        run: python bot.py
